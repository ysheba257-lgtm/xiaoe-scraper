[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "xiaoe-scraper"
version = "1.0.0"
description = "One-click batch downloader for course videos on xiaoe-tech (小鹅通) platforms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
xiaoe-scraper = "xiaoe_scraper.cli:main"
